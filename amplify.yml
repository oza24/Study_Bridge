version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Cleaning npm cache"
        - rm -rf .npm
        - npm install
    build:
      commands:
        - echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env.production
        - echo "AWS_REGION=$AWS_REGION" >> .env.production
        - echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> .env.production
        - echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> .env.production
        - echo "AUDIO_BUCKET_NAME=$AUDIO_BUCKET_NAME" >> .env.production
        - echo "DYNAMODB_TABLE=$DYNAMODB_TABLE" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
