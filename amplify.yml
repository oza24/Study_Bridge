version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "REGION=$REGION" >> .env
        - echo "ACCESS_KEY_ID=$ACCESS_KEY_ID" >> .env
        - echo "SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY" >> .env
        - echo "AUDIO_BUCKET_NAME=$AUDIO_BUCKET_NAME" >> .env
        - echo "DYNAMODB_TABLE=$DYNAMODB_TABLE" >> .env
        - echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env
        - echo "REGION=$REGION" >> .env.production
        - echo "ACCESS_KEY_ID=$ACCESS_KEY_ID" >> .env.production
        - echo "SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY" >> .env.production
        - echo "AUDIO_BUCKET_NAME=$AUDIO_BUCKET_NAME" >> .env.production
        - echo "DYNAMODB_TABLE=$DYNAMODB_TABLE" >> .env.production
        - echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*